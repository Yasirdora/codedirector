    Feature 8 — no-new-dependency cannot tell a version bump from a
    dependency, as recorded in IL-0010. Stated as the code has it today:
    package.json is already compared by its dependency maps only
    (src/run/deps.ts), but every other manifest — package-lock.json first —
    is hashed whole, and a bump rewrites the lockfile's own version fields.

    The untracked-directory fingerprint gap — found in eDraft IL-0028: the
    checkpoint and baseline take `git status --porcelain`, which reports a
    pre-existing untracked folder as one `?? dir/` line; readFileSync on it
    throws EISDIR, swallowed as "vanished", so the folder's files are never
    snapshotted or hashed and it reads as a new change after the run — a
    false OUT-OF-BUDGET. Evidence, cause with file references, the undo
    preview that named it "will be LOST" while leaving it intact, the fix and
    a regression test.

    Undo rolls approval seals back by accident, and says nothing — added by
    the human at approval, found during the same undo: undo resets a
    committed .codedirector/seals.json to HEAD (.codedirector/ is excluded
    from checkpoint blobs), so IL-0028's seal vanished silently, and which
    seals survive depends on whether a repo commits .codedirector/. Framed
    as the human asked: rolling the seal back with the work has logic too,
    so the candidate is to make the behaviour deliberate and loud, not to
    preserve seals.

  Documentation only: no source, test, README or package change. Not
  committed by this lock.
