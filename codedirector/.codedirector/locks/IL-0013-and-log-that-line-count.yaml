interpretation: |
  Its own 0.4.6 candidate rather than an observation on the untracked-
  directory entry: the cause is a different one, and it bites on a tracked
  file. Traced before drafting:

    - IL-0012's 12 = docs/ROADMAP.md's 9 + .codedirector/seals.json's 3
      (+2 −1, the seal `lock activate` wrote before the run). The classifier
      leaves .codedirector/ out; changedLineCount does not.
    - It counts seals.json because the baseline has no hash for it: in a
      project rooted in a subfolder, snapshotWorkTree lists files with
      `git ls-files` (subfolder-relative) and reads them as git-root-relative,
      so IL-0012's baseline hashed 3 files, from the wrong copies.
    - IL-0011's "3 lines of 127" was the same 3 seal lines; its new file
      counted 0. eDraft (rooted at its git root) counted exactly that day:
      IL-0029 10 of 10, IL-0030 1,877 of 1,877.

  The entry says what was counted, the cause with file references, why a
  ruler that errs both ways matters to maxLines, what is wanted, and a test.
  The classify.ts:145 use of the same hashes is named as not checked.

  Additions only: the IL-0011 sentence already committed ("counted as 3 lines
  of 127") stays as the report said it, and the new entry explains it. Not
  committed by this lock.
