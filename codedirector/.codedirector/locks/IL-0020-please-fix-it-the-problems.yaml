id: IL-0020
status: verified
utterance: please fix it the problems, also as I said it should work without code director
goal: "A check never rewrites a file it didn't change, and never loses one: after a probe (verifyCommand, tests, typecheck, output commands), only files whose bytes moved are written back; what the probe changed or added is moved to .codedirector/runs/put-back/ and named in the Change Report. And cdir never edits the project's .gitignore: its rules live in .codedirector/.gitignore (an old block in .gitignore is left as it is)."
interpretation: |
  BUILT IN A SPIKE FIRST: a scratch clone of 5b04903; nothing here is touched
  until this lock is active. The run copies the spike's 12 files in.

  THE TWO PROBLEMS, as the owner was told them (measured on a project that is
  not this repo, 2026-09-25):
  1 After its checks, cdir wrote back every dirty and untracked file in the
    project. 104 untracked files came back byte-identical but all with new
    times, and a change another session makes during a check would be undone
    without a word (new files deleted).
  2 Drafting a lock (cdir lock new → the index), not only a run, added the
    "# BEGIN cdir" block to the project's .gitignore.

  THE FIX
  1 restoreWorkTree writes back only files whose bytes moved. Before it
    replaces or removes a file, it moves the probe's version into
    .codedirector/runs/put-back/<time>-<id>/ (one folder per restore, made
    only when needed). It returns what it restored and removed. runIsolated
    passes that to an optional listener. Every probe (the baseline's output
    commands and typecheck; the verify's typecheck, tests-pass,
    verifyCommand and output-unchanged) adds it to verification.putBack, and
    the Change Report names each as a finding: which check, which files, and
    where their versions are. A put-back is reported, never a failure.
  2 ensureCodedirectorIgnore writes .codedirector/.gitignore (rules
    anchored to that folder) and never the project's .gitignore. A project
    that has the old block keeps it as it is. An existing
    .codedirector/.gitignore is never rewritten.

  The owner's "it should work without code director" is about the other
  project: it no longer uses cdir, and its cdir records were moved out of it.
  That's outside this repo; nothing here names it.

  EVIDENCE FROM THE SPIKE
  - npm test: 201 tests (194 before, 7 new), all pass.
  - Planted bugs, one per behavior: results in the report.
