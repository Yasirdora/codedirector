accept:
  - A failing verifyCommand's report item names the command's own output — a bounded stdout/stderr excerpt plus the full-output hashes — not only the exit code; the fail-first pin in test/verify.test.ts (a failing verifyCommand's item carries the command's own output, not the exit code alone) is red on today's tree and green after the fix.
  - "The pin reproduces the exit-code-only reporting: before the fix, the item's detail and artifactRef carry no byte of the command's output — proved against a stub chain that fails on purpose, so the pin does not depend on the real chain failing."
  - "Running a probe hands back the tree it took: a tracked file that differed from HEAD before the probe returns byte-identical afterwards, and a file that was clean returns at HEAD (measured 2026-09-30 in a scratch repo; pinned in test/run.test.ts)."
  - "The in-probe discrepancy is either eliminated or named: a chain that passes when run directly does not report a different exit code because of the isolation, or the report's evidence states the difference in its own words (three consecutive measured runs)."
  - No new dependency; the existing detail/artifact rendering carries the excerpt without a new record field.
