schemaVersion: 1
id: IL-0038
status: verified
utterance: "draft IL-0038 (the isolated probe defect in src/run/tree.ts). Draft only, no activation: the probe stores only the exit code, so a failing verifyCommand can't be diagnosed from the Change Report, and on this repo it reported exit 1/2 on a chain that passes directly. Include a pin that reproduces the exit-code-only reporting."
goal: "A failing verifyCommand is diagnosable from the Change Report, and the isolated probe is faithful: the report item carries the command's own output — a bounded stdout/stderr excerpt plus the full-output hashes — instead of the exit code alone, and the tree the probe hands back is the tree it took, so a chain that passes when run directly is never reported as a bare, unexplained exit 1/2."
interpretation: "Seams measured 2026-09-30 on this repo. (1) Diagnosis — proven by reading and by the records: the verify-command rung (src/verify/verify.ts:398-418) receives a ProbeResult that already carries stdout, stderr, stdoutSha256/stderrSha256 and an `omitted` count (src/run/probe.ts:22-40), and keeps only `sh -c \"…\" → exit N` (artifactRef) plus `verifyCommand failed (exit N): …` (detail). The typecheck rung solves the same problem with diagnosticsExcerpt (src/run/diagnostics.ts:102); the verify-command rung has no equivalent. The cost is in this repo's own run records: of seven IL-0036 attempts, four read `verifyCommand failed (exit 1|2)` with no output — including three whose own command exited 0 (IL-0036-20260930-050254-937-30q1-cae8 exit 2; …051536-928-1r091-13b8 exit 1; IL-0036-20260929-222116-493-1lv92-2ffd exit 1) — while the same chain is measured `held` in …044248-189-23aj1-48ff and …044521-842-148x1-be54. (2) Isolation — narrowed by measurement, not by argument: runIsolated (src/run/tree.ts:330) snapshots the work tree before the probe and puts it back after; the restore writes the snapshot's own bytes back for files that were dirty at snapshot (tree.ts:249-261) and falls back to `git checkout HEAD --` only for files that were clean then (tree.ts:266-303), where HEAD and the snapshot agree by construction. Measured 2026-09-30 in a scratch repo: a dirty tracked file the probe rewrote came back byte-identical to its pre-probe content, and a file that was clean came back at HEAD — so the first draft's reading, that the restore reverts uncommitted work to HEAD, is not the mechanism. What stands unexplained is the phenomenon the exit-only wording hides: the same chain passes in some probe runs and reports exit 1/2 in others, and the Change Report cannot say whether the tree or the isolation failed — which is what the pin must reproduce and the fix must make readable."
