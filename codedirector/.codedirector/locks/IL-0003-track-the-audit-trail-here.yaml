utterance: Track the audit trail here like eDraft does — locks, runs, seals committed; heavy artifacts (ckpt-blobs, baselines, captures, index.json) stay ignored. Do it as a small separate chore commit after Feature 1, not inside this lock. And add mcp.log to the ignore list when you build Feature 2.
goal: cdir's own repository commits its audit trail — the locks, the run records and the seals — while the heavy regenerable artifacts stay out of git. The blanket .codedirector/ ignore that currently hides all of it is gone.
interpretation: |
  One file. The blanket ".codedirector/" on line 3 is what actually hides the
  audit trail; cdir's managed block below it is moot while that line stands.
  Remove it, then adjust the managed block to the human's enumerated list:
  drop ".codedirector/runs/" so run records are committed, add
  ".codedirector/captures/" so captures are not.

  Editing inside the "# BEGIN cdir" block is safe and permanent:
  ensureCodedirectorIgnore returns early the moment the marker exists
  (src/core/store.ts), so cdir will never rewrite what is there.

  Two deliberate departures from "like eDraft does", because the analogy and
  the enumerated list disagree and the list is the specific instruction:
  eDraft TRACKS captures/ (here it is ignored) and IGNORES runs/ (here it is
  tracked).

  mcp.log needs no new line — "*.log" on line 4 already matches it. Confirmed
  when Feature 2 lands rather than pre-emptively added.
