goal: "A lock answers for the tree only until the next lock starts. Once another lock's task baseline has been captured after this lock's last attempt (and after its own task baseline, so a rebased lock is open again), `cdir report`, `cdir verify` and the MCP report tool show this lock's last attempt as recorded, name the lock that closed it, run no check again, and do not rewrite its status. With no later lock, nothing changes: the live tree is judged, a post-run edit is caught, and a fixed re-verification still refreshes the verdict (IL-0037). `cdir report --attempt N` shows an old attempt and writes nothing onto the lock. README says the rule and names the two cases it does not reach: locks running at the same time, and an edit made between one lock's last attempt and the next lock's start."
interpretation: TODO — the system's operationalization of the goal (edit to correct it)
keep:
  - kind: no-new-dependency
  - kind: api-unchanged
    symbols:
      - src/report/report.ts#buildReport
      - src/report/report.ts#finalizeLockStatus
  - kind: custom
    text: "The live run's own report (cdir run, run_locked) is untouched: a run is always judged on the tree it just changed, whatever other locks exist."
  - kind: custom
    text: "A closed lock can never read better than its last attempt recorded: the verdict, the scope and the checks are that attempt's, and an attempt that recorded no checks reads incomplete, never verified."
  - kind: custom
    text: Whether a recorded verdict is written onto the lock is decided in one place (finalizeLockStatus), for the CLI's report and verify and for the MCP tool alike.
