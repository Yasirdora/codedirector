goal: "A check the Lock requires that did not finish is never reported verified: the run, verify and report say incomplete (exit 3, lock status incomplete) and name the check; a violation still wins (failed, exit 1); custom clauses and the ladder's own typecheck stay named but do not block; npm test is green on the owner's Mac."
interpretation: |
  AUDIT FINDING F2, REPRODUCED ON MAIN (bb4b0cd): a lock whose verifyCommand
  was stopped by its timeout ended "Done — verified. … verifyCommand timed
  out after 300ms", exit 0, lock status verified. Only a violation could
  block the verdict; a check that never finished is not a violation.

  BUILT IN A SPIKE FIRST: a scratch clone of bb4b0cd; the run copies the
  spike's 18 files in.

  THE RULE, in one place (isRequiredCheck, src/verify/types.ts): required =
  every KEEP clause except custom, and the verifyCommand. Three outcomes:
  failed (a violation, or the command failed; exit 1) beats incomplete
  (nothing violated, a required check did not finish; exit 3, lock status
  incomplete) beats verified (exit 0). run, verify, report and run_locked
  (MCP error) all say it; the summary leads "Not verified: <check> did not
  finish — <reason>". Custom clauses and the ladder's own typecheck stay in
  the Unchecked bucket without blocking. With verification switched off,
  required clauses and the verifyCommand count as not run.

  ONE BEHAVIOUR CHANGE BEYOND THE AUDIT CASE, pinned by an existing test: a
  tests-pass glob reaching Swift files (node --test cannot run them) exited
  0; it is now incomplete, exit 3 — the lock asked for tests nobody ran.

  MUTATIONS: without the rule, 10 tests fail (incl. the audit's CLI
  reproduction and run_locked); widened to custom clauses and the typecheck,
  13 fail.

  EVIDENCE FROM THE SPIKE: npm test 260/260 on Node 22.22, on Node 24.15,
  and in the Mac-like composite; eval 20/20 (case 20 is the audit's case);
  end-to-end output against main differs only by the new "incomplete": []
  field in JSON reports. THE GATE is the owner's Mac: 260/260. Unchecked here.
