accept:
  - A verified lock whose deny was removed and budget widened by hand is refused by run ("seal mismatch") and its command never runs
  - A failed lock edited by hand is refused by run and by verify
  - A verified or failed lock with no seal entry is refused (fail-closed), naming lock check + lock activate
  - cdir lock activate and MCP lock_activate re-approve an edited failed lock (re-seal); an abandoned lock is still refused
  - An unchanged verified lock runs again
  - npm test green in full
