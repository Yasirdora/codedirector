schemaVersion: 1
id: IL-0015
status: verified
utterance: please fix them
goal: "The seal guards every lock that can still run: a verified or failed lock whose contract was edited after approval is refused by run and verify until the human re-approves it with lock check + lock activate, and activate accepts that re-approval for active, verified and failed locks (abandoned stays closed)."
interpretation: |
  SIZED BY A SPIKE, NOT GUESSED: a scratch clone of 2b9ddde; nothing in this tree
  is touched until this lock is active. The run applies the spike's patch with
  `git -C /Users/x/codedirector apply`.

  THE HOLE (reproduced on the installed build): sealViolation (src/lock/seal.ts)
  returned null for every status but active, on the reading that verified/failed
  locks are history. They are not — cdir run accepts both, and a lock reads
  verified after its first clean run. Removing a verified lock's deny and
  widening its budget by hand, then editing the denied file, reported "Done —
  verified … within the agreed scope". MCP run_locked and cdir verify call the
  same check.

  THE FIX: gate active, verified and failed (drafts and abandoned never run).
  Closing the hole also closes the documented rejudge path (README: raise a
  ceiling after a refusal and re-verify), which only worked through it — so
  lock activate (CLI and MCP) now accepts verified and failed as the
  re-approval, exactly as it already did for active. Abandoned stays closed.

  TESTS: run.test.ts +5 (verified edited → refused, command never ran; failed
  edited → refused; finished lock with no seal → refused; CLI activate
  re-approves a failed lock, abandoned refused; an unchanged verified lock runs
  again — a guard). mcp.test.ts +1 (edited failed lock refused by run_locked
  until lock_activate). FAIL-BEFORE at 2b9ddde: 5 of the 6 fail; the guard
  passes before and after. AFTER: npm test 184/184.
