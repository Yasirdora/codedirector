goal: "A run cannot hide what it changes by changing what git ignores: an edited .gitignore is judged like any other file, and a file the run's new ignore rules hide is judged as a change. Plus four small fixes found reviewing the domain split, with no other change in behaviour."
interpretation: |
  STEP 1 of the plan the owner approved ("close the known fence holes"),
  approved with "please proceed". BUILT IN A SPIKE FIRST: a scratch clone of
  3b96e49; nothing here is touched until this lock is active. The run copies
  the spike's 17 files in.

  TERRITORY: the utterance names no code (the drafter says so: its anchors
  are incidental words). The budget is the spike's diff, file by file.

  THE HOLE (ROADMAP 0.4.6), reproduced on main 3b96e49 the same day: a lock
  budgeting src/a.ts and denying .gitignore; a run that edits src/a.ts,
  creates notes.txt and appends notes.txt to .gitignore. Result: exit 0,
  "1 file(s) changed". Eval case 15 on main: 0 violations.

  THE FIX
  1 .gitignore is judged like any other file (classify, probe put-back,
    checkpoint dirty state). cdir has not written it since IL-0020.
  2 The baseline keeps the text of every ignore source (each .gitignore,
    .git/info/exclude). When a run changes one, each path git now ignores is
    checked against the old rules by git itself (check-ignore --no-index in
    a scratch repo); what they did not ignore is a change ("!!"), counted
    in the line total. Output the old rules already ignored stays out.
  3 Small fixes from the review: the api-unchanged graph and the report's
    findings use the run's domain registry; provenance ranks a resolved
    import above a name guess (source tiers); with verification off,
    package.json is compared by the same fingerprint the baseline took (it
    always read as changed); a diagnostics check is given stderr too.

  EVIDENCE FROM THE SPIKE
  - npm test: 231 tests (220 before, 11 new), all pass.
  - Each of the three small fixes: its test fails with the fix reverted.
  - Eval 16/16 (2 new: the hole, and a legitimate rule change that must
    stay clean). Case 15 fails on main.
  - End-to-end output on a TypeScript and a Swift fixture is identical to
    main after normalising times and hashes.
