schemaVersion: 1
id: IL-0010
status: verified
utterance: "Do the 0.4.5 bump. Seven features landed: anchor defense with a low-confidence flag, the flight recorder at .codedirector/mcp.log, verify coverage with a verifyCovers escape hatch, Swift indexing, the rejudge path, a budget that may name a file it will create, and identity beating coincidence in anchor ranking."
goal: package.json reads 0.4.5 and the README describes the tool as it now behaves — Swift among the indexed languages, verifyCovers in the Lock schema, the flight recorder, and verify re-judging a recorded run rather than replaying it.
interpretation: |
  Two files. The version, and the documentation the version is meant to
  describe — a bump that leaves the README describing 0.4.4 is a lie with a
  new number on it.

  Four passages are now false and are the whole documentation scope:

    - "Parsing choice" says parsing uses the official TypeScript and
      JavaScript grammars. It now also uses the prebuilt Swift grammar from
      tree-sitter-wasms, and the reason that package was chosen over
      tree-sitter-swift — which ships native bindings and no .wasm — belongs
      beside the sentence claiming pure WASM and no native compilation.
    - "Apple projects" offers Swift repositories a deny preset. They now get
      an index: eDraft reads as 294 files, 213 of them Swift.
    - The Lock schema list omits verifyCovers.
    - `cdir verify` is described as re-running the ladder. It now also
      re-judges scope against the Lock as it stands, which is the difference
      between a raised ceiling clearing a refusal and being ignored.

  The flight recorder gets a line where the MCP server is described, since a
  log a human is expected to read when something hangs is worth naming.

  Anchor defense, the low-confidence flag and identity-over-coincidence are
  deliberately NOT given new prose. They change what `cdir lock new` prints,
  and the README already documents that command by showing its output; a
  paragraph asserting the behaviour would duplicate what the tool says for
  itself.

  no-new-dependency is absent from keep for a mechanical reason, not an
  editorial one: the clause hashes package.json and fails on any edit to it,
  and a version bump is an edit to it. The clause cannot tell a version from
  a dependency. Recorded as a finding rather than worked around.
keep: []
deny:
  - package-lock.json
  - dist/**
  - node_modules/**
  - examples/**
  - src/**
  - test/**
change: Bump the version to 0.4.5 and correct the four README passages the seven features made false. No code changes.
verifyCommand: npm test
verifyTimeoutMs: 300000
budget:
  files:
    - package.json
    - README.md
  symbols: []
  maxFiles: 2
  maxLines: 200
accept:
  - package.json reads 0.4.5.
  - The parsing section names the Swift grammar and why tree-sitter-wasms was chosen over tree-sitter-swift.
  - The Apple section says Swift is indexed, not only denied.
  - The Lock schema list includes verifyCovers and what it is for.
  - The verify command reference says it re-judges scope against the current Lock.
  - The MCP section names .codedirector/mcp.log.
  - No file outside package.json and README.md changes.
  - npm test green at 175 — a documentation change must not move it.
