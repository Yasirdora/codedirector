schemaVersion: 1
id: IL-0025
status: verified
utterance: "the suite fails on my Mac — 5 test files, one root cause. When Swift is parsed, V8's background WASM tier-up crashes the process at exit (Fatal process out of memory: Zone, exit 133) on this Mac's Node v24.15, because --liftoff-only set mid-process via v8.setFlagsFromString doesn't take effect there. Set at process startup (node --liftoff-only …), it exits 0. Move the flag to process start; the proof is npm test green on this Mac, not just your container."
goal: cdir and its test suite run with --liftoff-only from process start on every Node version, so parsing Swift never crashes the process at exit (Node 24) or stalls it (Node 22); npm test is green on Node 24.15.
interpretation: |
  Corrects IL-0022, whose mid-process v8.setFlagsFromString does not take
  effect on Node 24. BUILT IN A SPIKE FIRST: a scratch clone of c950eda; the
  run copies the spike's 8 files in (cli.ts's body moves to cli-main.ts, so
  cli-main.ts arrives as a new file).

  REPRODUCED IN THIS CONTAINER with Node v24.15.0 (Linux x64), on c950eda:
  npm test exit 1 — 224 pass, 5 fail (findings, parser, profiles, verify
  crash; the swift-exit test), each "Fatal process out of memory: Zone". A
  one-file `cdir index` on Swift: exit 133 after 11s. With node
  --liftoff-only at start: exit 0 in 195 ms.

  THE FIX
  1 src/cli.ts is now only the entry: started without the flag (node
    cli.js, the npm bin, an MCP config) it relaunches the same command with
    it before loading anything else, forwards SIGINT/SIGTERM/SIGHUP and
    exits with the relaunched status. The guard variable is cleared in the
    relaunched process, so a cdir started by a check decides for itself.
  2 npm test (and npm run cdir) start node with the flag; the test runner
    passes it to every test file (checked on Node 22 and 24).
  3 IL-0022's mid-process flag, and the two-pass builder that fed it, are
    removed. A program that embeds cdir and parses Swift without the flag
    gets a one-line warning on stderr.
  COST: one bare Node start per command (~35 ms); a first full index of a
  JavaScript project is about a third slower (393 files: 1.16s -> 1.54s).

  EVIDENCE FROM THE SPIKE
  - npm test 248/248 on Node 24.15 and on Node 22.22; no "Fatal".
  - eval 19/19 on both. End-to-end output identical to c950eda.
  - test/launch.test.ts: without the launcher, 3 of its 6 tests fail on
    Node 24 (the other three guard parts that hold either way).

  THIS RUN: cdir and the verify command both on Node 24.15.
  NOT PROVABLE HERE: green on the owner's Mac — a custom clause, so the
  report leaves it Unchecked for the owner to judge.
keep:
  - kind: no-new-dependency
  - kind: custom
    text: npm test is green on the owner's Mac (Node v24.15) — the proof the owner asked for; this container can only stand in for it
