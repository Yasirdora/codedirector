  - dist/**
  - node_modules/**
  - src/lock/**
  - src/mcp/**
  - src/run/**
  - src/verify/**
  - .gitignore
change: cdir relaunches itself with --liftoff-only when started without it, npm test starts with it, and the mid-process flag is removed
