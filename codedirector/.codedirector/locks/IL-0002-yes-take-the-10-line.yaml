schemaVersion: 1
id: IL-0002
status: verified
utterance: Yes — take the ~10-line message sharpening as IL-0002 now. "This repo is mostly Swift and cdir indexes no Swift — the budget cannot come from anchors; name the files" is exactly the truth an eDraft user needs at draft time. Cheap, strictly more honest, do it.
goal: When territory drift fires and the repo's plurality language is one cdir cannot index at all, the low-confidence reason says so plainly — that no budget can come from anchors here and the human must name the files — instead of the softer "may not be indexed" wording that understates a total blindness. And an anchor's defence names the string the token was actually found in, so the evidence it shows is true.
interpretation: |
  Two corrections to what a draft SAYS. Neither changes which anchors are
  picked, and neither touches anchor resolution.

  1. TOTAL BLINDNESS IS NOT "MAY NOT BE INDEXED". Territory drift currently
     says the files those words point at "may not be indexed at all". When
     the repo's plurality language has no extension in INDEXABLE_EXTENSIONS,
     "may" is false modesty: cdir indexes NONE of it, and no amount of
     re-reading the anchors will produce a budget. Say that instead — this
     repo is mostly <lang> and cdir indexes no <lang>, the budget cannot
     come from anchors, name the files. The softer wording stays for the
     case it is true of: a language cdir CAN index that merely is not the
     one the anchors landed in.

  2. THE DEFENCE MUST NOT MISREPORT ITS OWN EVIDENCE. Found while drafting
     this lock: the defence line for ImagePipeline.describe read `"line"
     only occurs inside "describe"`, which is plainly false — "describe"
     contains no "line". The token matched the QUALIFIED name
     ("imagepipeline.describe"); the message printed the bare name. Name
     whichever string actually contains the token. Derived in defendAnchors
     from the symbol itself, so AnchorMatch and map.ts are untouched.
