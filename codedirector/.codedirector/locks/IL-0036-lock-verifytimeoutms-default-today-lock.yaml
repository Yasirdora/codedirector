schemaVersion: 1
id: IL-0036
status: verified
utterance: "LOCK A (verifyTimeoutMs default): today a lock draft without an explicit verifyTimeoutMs silently gets 60s, which no real Swift chain fits — this caused two slips today. Measured seam first: find where the default is applied (draft creation / run). Fix: the drafter must require the field or estimate it from the verifyCommand contents (xcodebuild present ⇒ ≥3600000), never silently default to 60s. Fail-first pin: drafting without the field either errors or gets a sane estimate — assert it."
goal: "A lock that carries a verifyCommand never silently runs under a 60s timeout: the drafter estimates verifyTimeoutMs from the command (xcodebuild ⇒ 3,600,000; otherwise a 900,000 floor), cdir lock new and the MCP lock_draft/lock_amend tools can set it explicitly, and the run/verify path never falls back to 60s for a lock that carries a verifyCommand."
interpretation: "Seam measured 2026-09-30: src/lock/draft.ts:398 emits verifyTimeoutMs only when it is passed explicitly; src/verify/verify.ts:315 and :385 then apply `opts.testTimeoutMs ?? lock.verifyTimeoutMs ?? 60_000`. Neither `cdir lock new` (no --verify-timeout flag) nor the MCP lock_draft/lock_amend tools (verifyTimeoutMs is not in AMENDABLE_PROPS and draftArgsFrom ignores it) can set the field, so every hand-drafted verifyCommand ran under a silent 60s. Fix: the drafter estimates the field from the command (xcodebuild ⇒ 3_600_000, else a 900_000 floor), both front-ends gain the argument, and the run/verify fallback for a lock carrying a verifyCommand becomes the 900_000 floor — never 60_000."
