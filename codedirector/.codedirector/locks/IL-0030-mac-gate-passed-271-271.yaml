goal: "An id's API is every declaration it names: api-unchanged compares all overloads of an id (sorted), so changing, adding or removing any overload is a proven violation that names the change, reordering is not, and single-declaration ids hash exactly as before; TypeScript overload signatures are indexed; npm test is green on the owner's Mac."
interpretation: |
  AUDIT FINDING F4, REPRODUCED ON 38d5ac8 (the audit's own script):
  save(_ v: Int) and save(_ v: String) both index as Store.swift#Store.save;
  the graph and the baseline keep one declaration per id — the last — so
  changing the Int overload to Bool reports "signature unchanged", exit 0.
  The same hole in TypeScript: class method overloads collapse the same way,
  and a function's overload signatures are not indexed at all.

  BUILT IN A SPIKE FIRST: a scratch clone of 38d5ac8; the run copies the
  spike's 10 files in.

  CHOSEN: ids stay as they are (Locks name them; sealed Locks cannot be
  edited without re-approval); what an id stands for becomes all of it.
  1 apiSignatures (lock/check.ts): every declaration the id names, sorted;
    the baseline and the verifier compare that. Change / add / remove any
    overload: proven violation naming it ("save(_ v: Int) → save(_ v:
    Bool)"; the baseline keeps the texts). Reorder: held. One declaration
    hashes exactly as before — existing baselines stay valid; end-to-end
    output unchanged.
  2 TypeScript: overload signatures (function_signature) are indexed under
    the function's id; parser version 6.
  3 lock check warns when an api-unchanged id names several declarations.
  4 The graph lists an id once by name: `cdir why` printed an overloaded
    symbol once per declaration.
  The Swift extractor is not touched (denied below): the fix is the core's.

  MUTATIONS: last declaration only — 5 tests fail; TS overload signatures
  unindexed — 1; source order instead of sorted — the reorder test; an id
  listed per declaration — the why test.

  EVIDENCE FROM THE SPIKE: npm test 280/280 on Node 22.22, Node 24.15 and in
  the Mac-like composite; eval 22/22 (case 22 is the audit's case); the
  audit's script: before "signature unchanged" exit 0, after the named
  violation exit 1. THE GATE is the owner's Mac: 280/280. Unchecked here.
