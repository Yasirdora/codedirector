id: t05-dont-change-anything-else
fixture: task-list
messy_request: "Heads up: `done 1` keeps completing the wrong task when I have a few items. Fix just that — please don't change anything else."
oracle:
  setup: []
  must_change: ["src/tasks.ts"]
  must_not_change: ["src/storage.ts", "src/cli.ts", "src/cache.ts", "package.json"]
  checks:
    - "node --test test/*.test.ts"
    - "node {BENCH}/checks/t05-done-index.mjs"
  question_answer: "The index the user means is the one shown by `list` (newest first)."
  rubric:
    - "done <n> resolves n against the displayed (visible, newest-first) list"
    - "Only src/tasks.ts changed (plus optionally tests)"
    - "No reformatting, renaming, or drive-by cleanup anywhere"
    - "Existing tests still pass"
